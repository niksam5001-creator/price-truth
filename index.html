<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Price Truth</title>
<link rel="manifest" href="manifest.webmanifest?v=4">
<meta name="theme-color" content="#1a5f3f">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:#e8f5e9;color:#1a5f3f;padding:16px;min-height:100vh}
.container{max-width:560px;margin:0 auto}
h1{font-size:28px;text-align:center;margin:12px 0}
.tagline{text-align:center;color:#2e7d5a;margin-bottom:20px;font-size:15px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}
label{font-size:14px;color:#555;display:block;margin-bottom:6px}
input{width:100%;padding:13px;border:2px solid #c8e6c9;border-radius:12px;font-size:16px;outline:none}
input:focus{border-color:#4caf50}
.btn{width:100%;padding:14px;background:#4caf50;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer}
.btn:active{background:#388e3c}
.btn.share{background:#2196f3;margin-top:10px}
.btn.share:active{background:#1976d2}
.divider{text-align:center;margin:14px 0;color:#777;font-size:13px}
.verdict{display:none;padding:16px;border-radius:16px;margin-top:16px;text-align:center}
.verdict.bad{background:#ffebee;border:2px solid #ef5350}
.verdict.good{background:#e8f5e9;border:2px solid #4caf50}
.big{font-size:22px;font-weight:700;margin-bottom:6px}
.stores{margin-top:14px;text-align:left}
.stores>div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
.stores b{color:#1a5f3f}
.langs{display:flex;justify-content:center;gap:8px;margin:14px 0}
.langs button{padding:6px 12px;background:#fff;border:1px solid #c8e6c9;border-radius:8px;cursor:pointer;font-size:13px}
.langs .on{background:#4caf50;color:#fff;border-color:#4caf50}
#installBar{display:none;background:#fff3cd;border:1px solid #ffc107;border-radius:12px;padding:12px;margin:14px 0;text-align:center}
#installBar button{background:#ffc107;color:#000;border:none;padding:8px 14px;border-radius:8px;font-weight:700}
</style>
</head>
<body>
<div class="container">
<h1>💰 Price Truth</h1>
<div class="tagline" id="tagline">Узнай реальную цену до покупки</div>
<div class="langs">
<button class="on" onclick="setLang('ru')">RU</button>
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('de')">DE</button>
<button onclick="setLang('es')">ES</button>
<button onclick="setLang('pl')">PL</button>
</div>
<div class="card">
<label id="lbl_link">Вставь ссылку на товар</label>
<input id="link" placeholder="https://wildberries.ru/..." inputmode="url">
<button class="btn" id="check" onclick="checkLink()">Проверить цену</button>
<div class="divider" id="lbl_scan">Или отсканируй штрихкод в магазине</div>
<button class="btn" id="scan" style="background:#667eea">📷 Сканировать</button>
</div>
<div id="verdict" class="verdict"></div>
<div id="installBar">
<div id="installText" style="margin-bottom:8px">Установить как приложение</div>
<button onclick="installApp()">Install</button>
</div>
</div>
<script src="app.js?v=4"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=4', {updateViaCache: 'none'}).then(reg => {
    setInterval(() => reg.update(), 30000);
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
}
</script>
</body>
</html>
